name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: homeradar
          POSTGRES_PASSWORD: homeradar
          POSTGRES_DB: homeradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homeradar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore -c Release -p:GenerateOpenApi=true
      - name: Test
        env:
          HOMERADAR_TEST_CONNECTION: Host=localhost;Port=5432;Username=homeradar;Password=homeradar;Database=homeradar_test
        run: dotnet test --no-build -c Release
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli lint docs/api/generated/HomeRadar.Api.json --ruleset docs/api/.spectral.yaml
      - name: OpenAPI contract is committed
        run: |
          cp docs/api/generated/HomeRadar.Api.json docs/api/openapi.v1.json
          git diff --exit-code -- docs/api/openapi.v1.json || (echo "docs/api/openapi.v1.json is out of date: run the build with -p:GenerateOpenApi=true and commit it" && exit 1)
      - name: Detect breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:docs/api/openapi.v1.json" > /tmp/base.json || exit 0
          docker run --rm -v "$PWD:/specs:ro" -v /tmp/base.json:/base.json:ro tufin/oasdiff breaking /base.json /specs/docs/api/openapi.v1.json --fail-on ERR
      - name: Upload generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/generated/*.json
