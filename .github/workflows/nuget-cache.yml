name: nuget-cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Directory.Packages.props
      - build/NuGetCache/**
      - .github/workflows/nuget-cache.yml

permissions:
  contents: write

jobs:
  publish-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore every package into an isolated folder
        run: dotnet restore build/NuGetCache/NuGetCache.csproj --packages nuget-packages
      - name: Pack the cache
        run: tar -C nuget-packages -czf nuget-cache-linux.tgz . && ls -lh nuget-cache-linux.tgz
      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nuget-cache >/dev/null 2>&1 || gh release create nuget-cache --title "NuGet offline cache" --notes "Regenerated by CI; not a software release." --prerelease
          gh release upload nuget-cache nuget-cache-linux.tgz --clobber
