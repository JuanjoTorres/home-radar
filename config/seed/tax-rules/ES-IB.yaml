rules:
  # --- Transfer tax (ITP, resale) ---------------------------------------------------------------
  - id: itp_general_scale
    tax: TransferTax
    appliesTo: Resale
    kind: ProgressiveScale
    role: Standard
    brackets:
      - { upTo: 400000, rate: 0.08 }
      - { upTo: 600000, rate: 0.09 }
      - { upTo: 1000000, rate: 0.10 }
      - { upTo: 2000000, rate: 0.12 }
      - { rate: 0.13 }
    description: "ITP general progressive scale 8-13 % (art. 10 a) TR)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2014-6925"

  - id: itp_garage_scale
    tax: TransferTax
    appliesTo: Resale
    kind: ProgressiveScale
    role: Override
    conditions:
      propertyTypes: [Garage]
    brackets:
      - { upTo: 30000, rate: 0.08 }
      - { rate: 0.09 }
    description: "ITP for a standalone parking space: 8 % up to 30,000 EUR and 9 % above (art. 10 b) TR)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2014-6925"

  - id: itp_primary_residence_4
    tax: TransferTax
    appliesTo: Resale
    kind: ReducedRate
    role: Relief
    conditions:
      primaryResidence: true
      noOtherHome: true
      priceMax: { subdivisionLimitFactor: 1.0 }
    rate: 0.04
    rateAppliesUpTo: 270151.20
    excessRate: 0.08
    description: "ITP 4 % for a primary residence on the first 270,151.20 EUR and 8 % on the excess, value up to the island limit (art. 10 c) TR and DA 5.ª)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"

  - id: itp_under36_first_home_2
    tax: TransferTax
    appliesTo: Resale
    kind: ReducedRate
    role: Relief
    conditions:
      ageMax: 35
      firstHome: true
      primaryResidence: true
      noOtherHome: true
      priceMax: { subdivisionLimitFactor: 1.0 }
    rate: 0.02
    rateAppliesUpTo: 270151.20
    excessRate: 0.08
    description: "ITP 2 % for buyers under 36 buying their first home as primary residence, on the first 270,151.20 EUR and 8 % on the excess (art. 10 d) 1.º TR)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"

  - id: itp_disability_relatives_2
    tax: TransferTax
    appliesTo: Resale
    kind: ReducedRate
    role: Relief
    conditions:
      disabilityMinimumForRelatives: true
      primaryResidence: true
      noOtherHome: true
      priceMax: { subdivisionLimitFactor: 1.0 }
    rate: 0.02
    rateAppliesUpTo: 270151.20
    excessRate: 0.08
    description: "ITP 2 % when the buyer applies the IRPF disability minimum for ascendants or descendants (art. 10 d) 2.º TR)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"

  - id: itp_large_or_single_parent_family_2
    tax: TransferTax
    appliesTo: Resale
    kind: ReducedRate
    role: Relief
    conditions:
      primaryResidence: true
      noOtherHome: true
      anyOf:
        - { familyTypes: [Large], priceMax: { subdivisionLimitFactor: 1.15 } }
        - { familyTypes: [SingleParent], priceMax: { subdivisionLimitFactor: 1.0 } }
    rate: 0.02
    rateAppliesUpTo: 270151.20
    excessRate: 0.08
    description: "ITP 2 % for large families (value up to the island limit + 15 %) and single-parent families (art. 10 d) 3.º TR, Ley 4/2026)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"
    note: "Single-parent families of special category may also get the +15 % margin; the engine applies it only to large families"

  - id: itp_under30_or_disability33_bonus_100
    tax: TransferTax
    appliesTo: Resale
    kind: QuotaBonus
    role: Relief
    conditions:
      anyOf:
        - { ageMax: 29 }
        - { disabilityPercentMin: 33 }
      firstHome: true
      primaryResidence: true
      noOtherHome: true
      balearicResidencyYearsMin: 3
      priceMax: { subdivisionLimitFactor: 1.0 }
      taxableIncomeMaxIndividual: 52800
      taxableIncomeMaxJoint: 84480
      mortgageMinLoanToValue: 0.60
    bonus: 1.00
    bonusAppliesUpTo: 270151.20
    validFrom: "2024-01-01"
    description: "100 % bonus on the ITP of the first 270,151.20 EUR for buyers under 30 or with disability ≥ 33 % (art. 14 quater TR)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"
    verified: false
    note: "The excess over 270,151.20 EUR is taxed at 8 % by reading art. 10 d) 1.º with DA 5.ª.2; no published ATIB criterion yet"

  - id: itp_price_limited_bonus_50
    tax: TransferTax
    appliesTo: Resale
    kind: QuotaBonus
    role: Relief
    conditions:
      housingRegimes: [PriceLimited]
    bonus: 0.50
    description: "50 % bonus on the ITP for price-limited housing (VPL, art. 14 septies TR)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"

  # --- Stamp duty (AJD, new homes) ----------------------------------------------------------------
  - id: ajd_general_1_5
    tax: StampDuty
    appliesTo: NewBuild
    kind: FlatRate
    role: Standard
    rate: 0.015
    description: "AJD 1.5 % on the purchase deed of a new home (art. 15 TR)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"

  - id: ajd_high_value_2
    tax: StampDuty
    appliesTo: NewBuild
    kind: FlatRate
    role: Override
    conditions:
      priceMin: 1000000
    rate: 0.02
    description: "AJD 2 % for properties worth 1,000,000 EUR or more (art. 17 bis TR)"
    sourceUrl: "https://www.boe.es/buscar/pdf/2014/BOE-A-2014-6925-consolidado.pdf"

  - id: ajd_primary_residence_1
    tax: StampDuty
    appliesTo: NewBuild
    kind: ReducedRate
    role: Relief
    conditions:
      firstHome: true
      primaryResidence: true
      noOtherHome: true
      priceMax: { subdivisionLimitFactor: 1.0 }
    rate: 0.01
    rateAppliesUpTo: 270151.20
    excessRate: 0.015
    description: "AJD 1 % for a first primary residence on the first 270,151.20 EUR and 1.5 % on the excess (art. 17.1 TR, Ley 4/2026)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"

  - id: ajd_under36_family_disability_0_5
    tax: StampDuty
    appliesTo: NewBuild
    kind: ReducedRate
    role: Relief
    conditions:
      anyOf:
        - { ageMax: 35 }
        - { disabilityMinimumForRelatives: true }
        - { familyTypes: [Large, SingleParent] }
      firstHome: true
      primaryResidence: true
      noOtherHome: true
      priceMax: { subdivisionLimitFactor: 1.0 }
    rate: 0.005
    rateAppliesUpTo: 270151.20
    excessRate: 0.015
    description: "AJD 0.5 % for under-36, disability-minimum or large/single-parent buyers on the first 270,151.20 EUR (art. 17.2 TR, Ley 4/2026)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"

  - id: ajd_under30_or_disability33_bonus_100
    tax: StampDuty
    appliesTo: NewBuild
    kind: QuotaBonus
    role: Relief
    conditions:
      anyOf:
        - { ageMax: 29 }
        - { disabilityPercentMin: 33 }
      firstHome: true
      primaryResidence: true
      noOtherHome: true
      balearicResidencyYearsMin: 3
      priceMax: { subdivisionLimitFactor: 1.0 }
      taxableIncomeMaxIndividual: 52800
      taxableIncomeMaxJoint: 84480
      mortgageMinLoanToValue: 0.60
    bonus: 1.00
    bonusAppliesUpTo: 270151.20
    description: "100 % bonus on the AJD of the first 270,151.20 EUR for buyers under 30 or with disability ≥ 33 % (art. 19 quater TR)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"

  - id: ajd_price_limited_bonus_50
    tax: StampDuty
    appliesTo: NewBuild
    kind: QuotaBonus
    role: Relief
    conditions:
      housingRegimes: [PriceLimited, AppraisedPrice]
    bonus: 0.50
    description: "50 % bonus on the AJD for price-limited or appraised-price housing (art. 19 quinquies TR)"
    sourceUrl: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-15579&p=20260613&tn=0"

aidPrograms:
  - id: ico_state_guarantee
    name: Aval ICO primera vivienda
    kind: LoanGuarantee
    conditions:
      anyOf:
        - { ageMax: 35 }
        - { hasDependentChildren: true }
      noOtherHome: true
      primaryResidence: true
      spanishResidencyYearsMin: 2
      householdIncomeMaxPerBuyer: 63000
      netWorthMax: 150000
    guaranteeTiers:
      - { maxLoanToValue: 1.00 }
    guaranteeFeePercent: 0
    validTo: "2027-12-31"
    sourceUrl: "https://www.boe.es/boe/dias/2026/07/02/pdfs/BOE-A-2026-14404.pdf"
    note: "Balearic income limit 7.5 × IPREM per buyer (ICO note 2026-06-24); +0.3 × IPREM per minor not applied. Not combinable with IBAVI in the same loan according to the press (unregulated)"

  - id: ibavi_nova_hipoteca_jove
    name: IBAVI Nova Hipoteca Jove
    kind: LoanGuarantee
    conditions:
      noOtherHome: true
      primaryResidence: true
      balearicResidencyYearsMin: 5
      priceMax: { amount: 382744.84, basis: Price }
      bankLoanToValueMin: 0.80
      anyOf:
        - { buyerCountMax: 1, householdIncomeMax: 60666.65 }
        - { buyerCountMin: 2, householdIncomeMax: 68250 }
    guaranteeTiers:
      - conditions:
          anyOf:
            - { ageMax: 39 }
            - { familyTypes: [Large, SingleParent] }
            - { disabilityPercentMin: 33 }
        maxLoanToValue: 1.00
      - { maxLoanToValue: 0.95 }
    guaranteeFeePercent: 0.5
    validTo: "2028-02-01"
    sourceUrl: "https://www.caib.es/sites/nova_hipoteca_jove/es/requisitos/"
    note: "Guarantee of 20 % of the price (all buyers under 40 or family/disability) or 15 %; the bank must lend at least 80 %. Subject to the programme budget"

  - id: govern_direct_grant_10000
    name: Ayuda directa del Govern 10.000 €
    kind: DirectGrant
    conditions:
      ageMax: 40
      noOtherHome: true
      primaryResidence: true
      balearicResidencyYearsMin: 5
      priceMax: { amount: 382000, basis: Price }
      anyOf:
        - { householdIncomeMax: 54600 }
        - { familyTypes: [Large], householdIncomeMax: 58800 }
        - { disabilityPercentMin: 33, householdIncomeMax: 58800 }
    grantAmount: 10000
    budgetLimited: true
    validFrom: "2026-07-17"
    validTo: "2027-12-31"
    sourceUrl: "https://www.caib.es/seucaib/ca/arxiuServlet?id=6528582"
    note: "Paid after the purchase and first come, first served (6 M EUR); never counted as cash at signing. Income limit 6.5 × IPREM; 7 × applied conservatively to the special groups"
