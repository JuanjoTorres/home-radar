# Illes Balears: transfer tax (ITP) for resale, stamp duty (AJD) for new homes, island value limits and aid programmes.
# Every figure comes from docs/fiscalidad-baleares.md (verified 2026-11-14). Rules marked `verified: false`
# are interpretations still pending an official criterion; the API shows them as warnings when they apply.
# A new revision is a new immutable row in tax_rule_sets: bump `revision` to correct figures.
