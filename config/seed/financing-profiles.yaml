# Example financing profile. Real figures belong in financing-profiles.local.yaml (git-ignored).
profiles:
  - key: example
    revision: 1
    name: Ejemplo
    savings: 60000
    netMonthlyIncome: 3000
    existingMonthlyDebt: 0
    maxDebtToIncomeRatio: 0.35
    isDefault: true
    mortgage:
      type: Fixed
      maxLoanToValue: 0.8
      nominalRatePercent: 2.9
      termMonths: 360
    buyer:
      age: 34
      firstHome: true
      primaryResidence: true
      residentInBalearics: true
      yearsResidentInBalearics: 5
      # Optional, they unlock or rule out reliefs and aid (see docs/api/README.md):
      # taxableIncomeBase: 30000      # IRPF taxable base (100 % ITP bonus for under 30)
      # jointTaxReturn: false
      # grossAnnualIncome: 42000      # household gross income (ICO, IBAVI, 10,000 € grant)
      # netWorth: 60000               # ICO guarantee
      # buyerCount: 1
      # yearsResidentInSpain: 10
