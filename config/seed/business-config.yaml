      visitChecklist:
      - level: ReadyToMoveIn
        checks:
        - Valid habitability certificate (cédula, valid 10 years)
        - Building evaluation report (IEE) if the building is 50 years or older, and pending levies
        - Energy certificate rating and year
        - 'Electrical certificate (boletín) year: older than 20 years needs a review to change power or holder'
        - Permits for past works, especially closed terraces or new layouts
        - Electrical panel with main switch, 30 mA differentials, several circuits and earthed sockets
        - Water pressure, hot water and cisterns
        - 'Windows: thermal break and double glazing'
        - Damp or mould on ceilings, corners and north walls
        - Air conditioning units, age and gas type
        - Water heater type and year
      - level: Medium
        checks:
        - 'Pipe material under the sink and at the meter: lead or galvanised iron means renewing the plumbing (RD 3/2023)'
        - 'Fibre-cement downpipes or tanks: possible asbestos before 2002'
        - Kitchen units, worktop and water and gas connections
        - 'Bathrooms: tray or tub, ventilation, cracks and black joints'
        - Hollow-sounding tiles; original hydraulic tiles worth keeping
        - 'Gotelé on walls: removing it raises painting cost'
      - level: Full
        checks:
        - 'Aluminosis (buildings 1955-1977): cracks along joists, rust and spalling; ask for a test before signing'
        - 'Rising damp, very common on Mallorca ground floors: salt marks on the lower metre of walls'
        - 'Structure: diagonal cracks, sagging floors, doors that rub'
        - 'Roof or terrace: waterproofing, broken tiles, fibre-cement roofing, gutters'
        - 'Façade and balconies: spalling and exposed rusty rebar'
        - 'Old wiring: porcelain fuses, cloth cables, no earth'
        - 'Load-bearing partitions: touching the structure needs a major licence with an architect project'
        - Power upgrade with the distributor can cost from 2,000 EUR and take 2-4 months
        - 'Protected buildings or Palma old town: more permits and higher cost'
