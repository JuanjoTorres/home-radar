        min: { $ref: '#/components/schemas/Money' }
        likely: { $ref: '#/components/schemas/Money' }
        max: { $ref: '#/components/schemas/Money' }
        lineItems: { type: array, items: { type: object, properties: { code: { type: string }, label: { type: string }, quantityM2: { type: number }, unitCost: { $ref: '#/components/schemas/Money' }, likely: { $ref: '#/components/schemas/Money' } } } }
        toVerifyOnVisit: { type: array, items: { type: string } }
        maxRenovationBudgetToStayAffordable: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
    RenovationOverride:
