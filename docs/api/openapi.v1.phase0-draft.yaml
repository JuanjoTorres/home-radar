      type: object
      properties:
        status: { type: string, enum: [Seen, Visited, OfferMade, Discarded] }
        notes: { type: [string, 'null'] }
    WatchlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        listing: { $ref: '#/components/schemas/ListingSummary' }
        status: { type: string, enum: [Seen, Visited, OfferMade, Discarded] }
        notes: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
    BusinessConfigVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
