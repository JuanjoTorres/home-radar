      type: object
      properties:
        source: { $ref: '#/components/schemas/Source' }
        recentRuns: { type: array, items: { type: object, properties: { startedAt: { type: string, format: date-time }, finishedAt: { type: string, format: date-time }, listingsSeen: { type: integer }, created: { type: integer }, changed: { type: integer }, errors: { type: integer }, outcome: { type: string, enum: [Succeeded, Degraded, Failed] }, message: { type: [string, 'null'] } } } }
    WebhookSubscriptionInput:
      type: object
