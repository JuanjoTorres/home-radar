        events: { type: array, items: { type: string, enum: [listing.created, listing.priceChanged, listing.statusChanged, watchlist.changed] } }
        secret: { type: string, description: Used to sign payloads (HMAC-SHA256 in X-HomeRadar-Signature). }
    WebhookSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
