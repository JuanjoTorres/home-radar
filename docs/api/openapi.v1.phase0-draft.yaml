        createdAt: { type: string, format: date-time }
    WebhookEnvelope:
      type: object
      properties:
        id: { type: string, format: uuid, description: Delivery id; consumers must deduplicate on it. }
        event: { type: string }
        occurredAt: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
